<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 医院助手 · 小程序模拟版</title>
<style>
  :root{
    --b900:#1b3a5c; --b700:#2c5c8f; --b600:#3d7ebf; --b500:#5b9bd5;
    --b100:#e8f2fb; --b50:#f4f9fd; --line:#dbe7f3;
    --ink:#1f3a56; --muted:#6b8299; --wx:#07c160;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#e9eff6;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center}

  /* ---------- 手机外壳 ---------- */
  .phone{position:relative;width:390px;height:790px;background:#fff;border-radius:38px;
    border:8px solid #17324f;box-shadow:0 16px 44px rgba(23,50,79,.24);overflow:hidden;
    display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:18px;
    background:#17324f;border-radius:0 0 12px 12px;z-index:20}

  /* 状态栏 + 导航栏（压缩高度） */
  .statusbar{height:20px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:10px;color:#cfe0f2;background:var(--b700);flex:0 0 auto}
  .navbar{height:38px;display:flex;align-items:center;justify-content:center;position:relative;
    background:var(--b700);color:#fff;font-size:14.5px;font-weight:600;flex:0 0 auto}
  /* 导航栏右侧：小号"重置"按钮（只比导航栏底色深一点点，够看出能点即可） */
  .navreset{position:absolute;right:10px;top:9px;height:21px;padding:0 9px;border-radius:11px;
    background:rgba(255,255,255,.13);border:.5px solid rgba(255,255,255,.32);
    color:#d3e4f5;font-size:11px;line-height:1;display:flex;align-items:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .navreset:active{background:rgba(255,255,255,.26);color:#fff}

  /* 聊天区 */
  .chat{flex:1 1 auto;overflow-y:auto;padding:10px 10px 6px;background:var(--b50);
    display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;gap:7px;max-width:100%}
  .msg.user{justify-content:flex-end}
  .avatar{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:13px;background:var(--b100);border:1px solid var(--line)}
  .bubble{max-width:82%;padding:8px 11px;border-radius:13px;font-size:13.2px;line-height:1.66;
    word-break:break-word;box-shadow:0 1px 2px rgba(31,58,86,.05)}
  .msg.user .bubble{background:#d6e9fb;border:1px solid #c2ddf5;border-radius:13px 13px 4px 13px;color:var(--b900)}
  .msg.ai .bubble{background:#fff;border:1px solid var(--line);border-radius:13px 13px 13px 4px}
  .bubble strong{color:var(--b900)}

  /* 摘要行 */
  .sum{font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.5}
  .sum b{color:var(--b900);font-weight:600}
  .stat{display:inline-block;font-size:10.5px;border-radius:5px;padding:1px 6px;margin-right:5px;
    background:#eef6ff;color:#2c5c8f;border:1px solid #d6e6f7}

  /* 紧凑结果行 */
  .row{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed #e8f0f8;font-size:13px}
  .row:first-of-type{border-top:0}
  .row .idx{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:var(--b100);
    color:var(--b700);font-size:10.5px;display:flex;align-items:center;justify-content:center}
  .row .nm{flex:1 1 auto;line-height:1.45;color:var(--b900)}
  .row .nm a{color:var(--b900);text-decoration:none}
  .badge{flex:0 0 auto;font-size:9.5px;border-radius:4px;padding:1px 5px}
  .bA{background:#e7f6ef;color:#146c52;border:1px solid #a8ddc7}
  .bB{background:#e8f2fb;color:#245b8c;border:1px solid #b6d6f0}
  .bC{background:#fdf4e3;color:#8a5a12;border:1px solid #ecd3a3}

  /* 折叠区（默认收起，控制信息量） */
  details{margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
  summary{cursor:pointer;font-size:12px;color:var(--b600);list-style:none;outline:none;
    display:flex;align-items:center;gap:5px;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▸';font-size:11px;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details[open] summary{margin-bottom:7px}
  .full{font-size:12.3px;line-height:1.7;white-space:pre-wrap;color:#3a5573;
    max-height:260px;overflow-y:auto;padding-right:4px;background:#fafcfe;
    border:1px solid #eaf2f9;border-radius:8px;padding:8px 9px}
  .srcs{margin-top:7px}
  .src{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;background:#fcfdff}
  .src .t{font-size:12px;font-weight:600;line-height:1.45;color:var(--b900)}
  .src .m{font-size:10.5px;color:#8fa6ba;margin-top:3px;line-height:1.55;word-break:break-all}
  .src a{color:var(--b600);text-decoration:none}

  /* 快捷问题（默认只露 3 个） */
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:1px 0 3px}
  .chip{font-size:11.5px;background:#fff;border:1px solid var(--line);color:var(--b700);
    border-radius:999px;padding:5px 10px;cursor:pointer}
  .chip:active{background:var(--b100)}
  .more{font-size:11.5px;color:var(--b600);padding:5px 4px;cursor:pointer}

  .typing{font-size:11.5px;color:var(--muted);padding-left:33px}

  /* 输入栏 */
  .inputbar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
    padding:7px 9px calc(7px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:flex-end}
  .inputbar textarea{flex:1;min-height:36px;max-height:84px;resize:none;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit;outline:none;line-height:1.42;
    background:#fcfeff;color:var(--ink)}
  .inputbar textarea:focus{border-color:var(--b500);box-shadow:0 0 0 3px rgba(91,155,213,.13)}
  .sendbtn{background:var(--wx);color:#fff;border:0;border-radius:10px;padding:0 14px;height:36px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .sendbtn:disabled{opacity:.5;cursor:default}
  .foot{flex:0 0 auto;text-align:center;font-size:10px;color:#9db3c7;background:#fff;padding:0 10px 5px}

  @media (max-width:520px){
    body{display:block;background:#fff}
    .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
    .notch{display:none}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span id="clock">9:41</span><span>▮▮▮ ⌁ ▰</span></div>
  <div class="navbar">AI 医院助手
    <span class="navreset" id="navReset" title="开启新会话（与旧会话隔离）">重置</span>
  </div>

  <div class="chat" id="chat">
    <div class="msg ai">
      <div class="avatar">🏥</div>
      <div class="bubble">
        <b>AI 医院助手</b>｜演示范围<b>北京</b><br>
        我会实时联网检索，每条结论都附来源与时间。<br>
        <span style="font-size:11.5px;color:#8fa6ba">不做诊疗建议 · 急症请拨 120</span>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="inputbar">
    <textarea id="q" rows="1" placeholder="输入你的问题…"></textarea>
    <button class="sendbtn" id="send">发送</button>
  </div>
  <div class="foot">比赛演示 · 小程序模拟版（与网页版同一后端）</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const chat = $('chat');

const EX = [
  '北京有哪些医院设有卒中中心',
  '北京有抗蛇毒血清的医院',
  '北京清华长庚医院神经内科主任医师出诊安排',
  '第二家的地址和官方预约入口呢',
  '北京大学首钢医院地址和官方预约入口',
  '我胸痛该怎么办',
  '高血压吃什么药好',
  '有卒中中心的医院',
];
let shown = 3;
function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  EX.slice(0, shown).forEach((t) => {
    const b = document.createElement('span');
    b.className = 'chip'; b.textContent = t;
    b.onclick = () => { $('q').value = t; send(); };
    box.appendChild(b);
  });
  if (shown < EX.length) {
    const m = document.createElement('span');
    m.className = 'more'; m.textContent = '更多 ▾';
    m.onclick = () => { shown = EX.length; renderChips(); };
    box.appendChild(m);
  }
}
renderChips();

let sessionId = localStorage.getItem('mini_session') || ('mini-' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('mini_session', sessionId);

const TIER_SHORT = { A: 'A级·已核实', B: 'B级·官网', C: 'C级·待核实', D: 'D级·待核实' };
const TIER_CLASS = { A: 'bA', B: 'bB', C: 'bC', D: 'bC' };
const ST_TEXT = {
  ok: '✅ 含权威来源', partial: '⚠️ 仅非权威来源', need_clarify: '❓ 需补充条件',
  no_result: '⚠️ 未查到（≠没有）', refused_medical: '🚫 诊疗类已拒答', emergency: '🚨 紧急提示',
  refused_out_of_scope: '🚫 越界已拒答', empty: '请输入内容', too_long: '输入过长',
  search_failed: '⚠️ 检索异常', error: '⚠️ 系统异常',
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function md(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

function addMsg(role, html) {
  const w = document.createElement('div');
  w.className = 'msg ' + role;
  if (role === 'ai') { const a = document.createElement('div'); a.className = 'avatar'; a.textContent = '🏥'; w.appendChild(a); }
  const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = html;
  w.appendChild(b); chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
  return w;
}

function renderSources(list) {
  return (list || []).map((s) => {
    const tier = s.tier || 'C';
    const upd = s.sourceUpdatedAt ? ('更新 ' + String(s.sourceUpdatedAt).slice(0, 10)) : '来源未标注更新时间';
    return '<div class="src">' +
      '<div class="t"><span class="badge ' + (TIER_CLASS[tier] || 'bC') + '">' + esc(TIER_SHORT[tier] || tier) + '</span>' + esc(s.title) + '</div>' +
      '<div class="m">' + esc(s.site || '') + ' ｜ <a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">原文</a> ｜ ' + esc(upd) + '</div>' +
      '</div>';
  }).join('');
}

/** 分层折叠：默认只给"摘要 + 紧凑结果行"，完整依据与来源收进折叠区 */
function renderCompact(data) {
  const st = data.status || '';
  const srcs = data.sources || [];
  const hos = data.hospitals || [];
  const aCount = srcs.filter((s) => s.tier === 'A').length;

  let html = '';
  html += '<div class="sum"><span class="stat">' + esc(ST_TEXT[st] || st || '—') + '</span>';
  html += '来源 <b>' + srcs.length + '</b> 条（A级 ' + aCount + '）';
  if (data.query) html += ' ｜ 关键词 <b>' + esc(data.query) + '</b>';
  html += '</div>';

  // 结果行：紧凑，一屏能看完
  if (hos.length) {
    html += hos.slice(0, 5).map((h, i) =>
      '<div class="row"><span class="idx">' + (i + 1) + '</span>' +
      '<span class="nm">' + esc(h.name) + '</span>' +
      '<span class="badge ' + (TIER_CLASS[h.tier] || 'bC') + '">' + esc(TIER_SHORT[h.tier] || h.tier) + '</span></div>'
    ).join('');
    if (hos.length > 5) html += '<div class="sum">…另有 ' + (hos.length - 5) + ' 家</div>';
  }

  // 折叠：完整四段式 + 来源清单
  html += '<details><summary>展开完整依据与 ' + srcs.length + ' 条来源</summary>';
  html += '<div class="full">' + md(data.answer || '') + '</div>';
  html += '<div class="srcs">' + renderSources(srcs) + '</div>';
  html += '</details>';
  return html;
}

async function send() {
  const message = $('q').value.trim();
  if (!message) return;
  $('send').disabled = true;
  addMsg('user', esc(message));
  $('q').value = '';
  $('q').style.height = 'auto';
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.textContent = '正在联网检索…';
  chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId })
    });
    const data = await r.json();
    if (data.sessionId) { sessionId = data.sessionId; localStorage.setItem('mini_session', sessionId); }
    typing.remove();
    addMsg('ai', renderCompact(data));
  } catch (e) {
    typing.remove();
    addMsg('ai', '⚠️ 请求失败：' + esc(String(e && e.message ? e.message : e)));
  } finally {
    $('send').disabled = false;
    $('q').focus();
  }
}

async function reset() {
  try { await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId }) }); } catch (e) {}
  sessionId = 'mini-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('mini_session', sessionId);
  chat.innerHTML = '';
  addMsg('ai', '会话已重置。请重新描述你要查的医院资源或便民信息。');
  $('q').value = '';
}

$('send').onclick = send;
$('navReset').onclick = reset;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('q').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 84) + 'px'; });
function clock() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); $('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()); }
clock(); setInterval(clock, 30000);
</script>
</body>
</html>
